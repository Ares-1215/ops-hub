<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>班次｜運務資料中樞</title><link rel="stylesheet" href="assets/app.css"><script src="assets/app.js"></script></head>
<body><main>
<h1 class="pg">班次體檢卡</h1><p class="sub">一個班次 4 月以來每天的積載率、星期別體質、加班頻率、到著差。從減開清單、併櫃表、當日清單點班次代號會直接開這頁。</p>
<div class="bar"><input id="code" type="text" list="tpList" placeholder="班次代號，如 7628 / BF33" style="width:220px"><datalist id="tpList"></datalist><button id="go" class="pri">查詢</button><span class="note" id="hint"></span></div>
<div id="out"></div>
</main>
<script>
(async()=>{if(!shell('trip.html'))return;const code=qs('code');$('#code').value=code||'';$('#go').onclick=()=>{location.href='trip.html?code='+encodeURIComponent($('#code').value.trim())};$('#code').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
 api({action:'meta',k:'trip_dow'}).then(j=>{const dl=$('#tpList');Object.entries(j.v||{}).forEach(([c,t])=>{const o=document.createElement('option');o.value=c;o.label=t.name;dl.appendChild(o)});$('#hint').textContent=`可查 ${Object.keys(j.v||{}).length} 個班次`}).catch(()=>{});
 if(code)card(code)})();
async function card(code){const o=$('#out');o.innerHTML='<p class="note"><span class="spin"></span> 載入…</p>';try{const j=await api({action:'trip_hist',code});if(!j.info){o.innerHTML='<p class="note">查無此班次（只收錄 2026-04 起有封櫃紀錄的班次）</p>';return}const info=j.info,hist=j.hist||{};const days=Object.keys(hist).sort();
 const prof=DOWS.split('').map(w=>{const ds=days.filter(d=>dowOf(d)===w);const ls=ds.map(d=>hist[d].l);const ot=ds.filter(d=>/加班|追加/.test(hist[d].c)).length;const dl=ds.map(d=>hist[d].d).filter(x=>x!=null);return {w,n:ls.length,avg:ls.length?ls.reduce((a,b)=>a+b,0)/ls.length:null,low:ls.filter(x=>0<x&&x<=55).length,ot,late:dl.length?dl.filter(x=>x>15).length/dl.length*100:null}});
 const W=720,H=180,L=36,T=10,B=22;const n=days.length;const x=i=>L+(W-L-10)*(n===1?.5:i/(n-1));const bw=Math.max(1.5,(W-L-10)/n*.7);let g=`<svg class="ch" viewBox="0 0 ${W} ${H}">`;[0,25,50,75,100].forEach(v=>{const y=T+(H-T-B)*(1-v/100);g+=`<line class="axis" x1="${L}" x2="${W-10}" y1="${y}" y2="${y}"/><text class="lbl" x="${L-4}" y="${y+3}" text-anchor="end">${v}</text>`});const y55=T+(H-T-B)*(1-55/100);g+=`<line x1="${L}" x2="${W-10}" y1="${y55}" y2="${y55}" stroke="var(--red)" stroke-dasharray="3 3"/>`;
 days.forEach((d,i)=>{const h=hist[d];const y=T+(H-T-B)*(1-Math.min(100,h.l)/100);const c=/加班|追加/.test(h.c)?'var(--orange)':(h.l<=55?'var(--red)':'var(--acc)');g+=`<rect x="${x(i)-bw/2}" y="${y}" width="${bw}" height="${H-B-y}" fill="${c}" opacity=".85"><title>${iso(d)}(${dowOf(d)}) ${h.l}% ${h.n}櫃 ${h.c}${h.d!=null?' 到著'+(h.d>0?'晚':'早')+Math.abs(h.d)+'分':''}</title></rect>`;if(i%Math.ceil(n/10)===0||i===n-1)g+=`<text class="lbl" x="${x(i)}" y="${H-B+12}" text-anchor="middle">${d.slice(4,6)}/${d.slice(6)}</text>`});g+='</svg>';
 const ls=days.map(d=>hist[d].l);const avg=ls.reduce((a,b)=>a+b,0)/ls.length;const low=ls.filter(v=>0<v&&v<=55).length;const worst=prof.filter(p=>p.n>=3).sort((a,b)=>(b.low/b.n)-(a.low/a.n))[0];
 const verdict=low/ls.length>=.5?`<b>常態低載</b>：${days.length} 天裡 ${low} 天 ≤55%（${Math.round(low/ls.length*100)}%）`:low/ls.length>=.25?`<b>部分日子低載</b>：${low}/${days.length} 天 ≤55%`:`<b>積載正常</b>：只有 ${low}/${days.length} 天 ≤55%`;
 o.innerHTML=`<div class="card"><h3><span class="rid">${esc(code)}</span> ${esc(info.name)} <span class="muted small">${info.master&&info.master!==info.name?esc(info.master):''}</span></h3>
 <dl class="kv"><dt>起迄</dt><dd>${stLink(info.from)} → ${stLink(info.to)}（${esc(info.dir)}；${esc(info.rfrom)}→${esc(info.rto)}）</dd><dt>里程</dt><dd>${info.km!=null?fmt(info.km)+' km（113 回填中位數）':'無資料'}</dd><dt>出現</dt><dd>${info.n_days} 天（${iso(info.first)} ～ ${iso(info.last)}）；加班比 ${Math.round(info.ot_share*100)}%</dd><dt>體質</dt><dd>${verdict}；平均積載 ${avg.toFixed(1)}%${worst?`；最弱星期：週${worst.w}（${worst.low}/${worst.n} 天低載）`:''}</dd></dl>
 <div class="legend"><span><i style="background:var(--acc)"></i>正班 &gt;55%</span><span><i style="background:var(--red)"></i>≤55% 低載</span><span><i style="background:var(--orange)"></i>加班/追加</span><span>— 紅虛線 55%</span></div>${g}</div>
 <div class="grid2" style="margin-top:10px"><div class="card"><h3>星期別</h3><table><thead><tr><th>星期</th><th class="num">出現</th><th class="num">平均積載</th><th class="num">低載次數</th><th class="num">加班次</th><th class="num">到著晚>15分 %</th></tr></thead><tbody>${prof.map(p=>`<tr><td>${p.w}</td><td class="num">${p.n}</td><td class="num">${fmt(p.avg,1)}</td><td class="num ${p.n&&p.low/p.n>=.5?'up':''}">${p.low}</td><td class="num">${p.ot}</td><td class="num">${fmt(p.late,0)}</td></tr>`).join('')}</tbody></table></div>
 <div class="card"><h3>最近 30 次</h3><div class="scroll" style="max-height:320px"><table><thead><tr><th>日期</th><th>週</th><th class="num">積載</th><th class="num">櫃</th><th>類別</th><th class="num">到著差(分)</th></tr></thead><tbody>${days.slice(-30).reverse().map(d=>{const h=hist[d];return `<tr><td>${dayLink(d)}</td><td>${dowOf(d)}</td><td class="num ${h.l<=55?'up':''}">${h.l}</td><td class="num">${h.n}</td><td>${esc(h.c)}</td><td class="num ${h.d>15?'up':''}">${h.d==null?'—':h.d}</td></tr>`}).join('')}</tbody></table></div></div></div>`}catch(e){o.innerHTML='<p class="note">'+esc(e.message)+'</p>'}}
</script></body></html>
