<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>決策回看｜運務資料中樞</title><link rel="stylesheet" href="assets/app.css"><script src="assets/app.js"></script></head>
<body><main>
<h1 class="pg">決策回看</h1><p class="sub">建議了幾班、採用了幾班、實際有沒有開、隔天每千件里程有沒有變好。決策只存在中樞自己的資料庫，不碰公司系統。</p>
<div class="bar"><label>期間 <input id="rvFrom" type="date"> ～ <input id="rvTo" type="date"></label><button id="rvRun" class="pri">載入</button><span class="note">執行率＝採用班數／建議班數；「實際未開」＝採用的班次當天封櫃明細裡沒有出現（最多檢查前 40 班）；「到著影響」＝採用班次的迄站當天 117 拆櫃分/櫃與準點率，對該站前 4 週同星期平均</span></div>
<div class="tiles" id="rvTiles" style="margin:10px 0"></div>
<div class="scroll" id="rvTable" style="max-height:62vh"></div>
</main>
<script>
let TD=null,STC={};
async function arrivalImpact(adopted,y){/* 採用班次的迄站：該日 拆櫃分/櫃、準點率117 vs 該站前4週同星期平均 */
 if(!adopted.length)return null;if(!TD){try{const j=await api({action:'meta',k:'trip_dow'});TD=j.v||{}}catch(e){TD={}}}
 const sts=[...new Set(adopted.map(c=>(TD[c]?.to||'').slice(0,4)).filter(x=>/^\d{4}$/.test(x)))].slice(0,6);if(!sts.length)return null;const w=dowOf(y);const out=[];
 for(const st of sts){try{if(!STC[st]){const j=await api({action:'meta',k:'st:'+st});STC[st]=j.v}const S=STC[st];if(!S)continue;const d=S.days[y];if(!d)continue;const base=Object.keys(S.days).filter(k=>k<y&&dowOf(k)===w).sort().slice(-4).map(k=>S.days[k]);const b=k=>avgOf(base,k);
  out.push({st:S.name,ub:d.unload_box_min,ubb:b('unload_box_min'),on:d.ontime117,onb:b('ontime117'),late:d.late117,pph:d.pcs_per_hour,pphb:b('pcs_per_hour')})}catch(e){}}
 return out}
(async()=>{if(!shell('review.html'))return;await loadRows();$('#rvFrom').value=lISO(new Date(Date.now()-30*864e5));$('#rvTo').value=lISO(new Date(Date.now()+7*864e5));$('#rvRun').onclick=rvRun;rvRun()})();
async function rvRun(){const t=$('#rvTable');t.innerHTML='<p class="note"><span class="spin"></span> 載入…</p>';try{const j=await api({action:'decide_list',from:$('#rvFrom').value,to:$('#rvTo').value});if(!j.rows.length){t.innerHTML='<p class="note">這段期間沒有登記。去 <a href="cut.html">減開清單</a> 或 <a href="merge.html">併櫃模擬</a> 勾選並登記。</p>';$('#rvTiles').innerHTML='';return}
 const out=[];for(const d of j.rows){const y=d.day.replace(/-/g,'');const r=BY[y];const base=r?baseline(y):[];const bk=avgOf(base,'km_per_kpiece');let notRun=null;if(r&&(d.adopted||[]).length){notRun=0;for(const code of d.adopted.slice(0,40)){try{const h=await api({action:'trip_hist',code});if(h.hist&&!h.hist[y])notRun++}catch(e){}}}
  const imp=r?await arrivalImpact(d.adopted||[],y):null;
  out.push({imp,day:d.day,y,dow:r?r.dow:DOWS[(new Date(d.day).getDay()+6)%7],fc:d.forecast?.pieces,act:r?.pieces,sug:(d.suggested||[]).length,adp:(d.adopted||[]).length,rate:(d.suggested||[]).length?Math.round((d.adopted||[]).length/d.suggested.length*100):null,notRun,mg:(d.merges||[]).length,mgkm:(d.merges||[]).reduce((a,b)=>a+(b.cut_km||0),0),kpp:r?.km_per_kpiece,bk,er:r?.empty_rate,ot:r?.arrive_ontime_rate,by:d.by_emp,note:d.note,at:d.updated_at?new Date(d.updated_at).toLocaleString('zh-TW',{hour12:false}).slice(0,16):''})}
 const done=out.filter(o=>o.kpp!=null&&o.bk!=null);$('#rvTiles').innerHTML=[['登記天數',out.length,0],['建議班數合計',out.reduce((a,o)=>a+o.sug,0),0],['採用班數合計',out.reduce((a,o)=>a+o.adp,0),0],['平均執行率 %',avgOf(out.filter(o=>o.rate!=null),'rate'),0],['已有結果的天數',done.length,0],['每千件里程比基準低的天數',done.filter(o=>o.kpp<o.bk).length,0]].map(([k,v,d])=>`<div class="tile"><div class="k">${k}</div><div class="v">${fmt(v,d)}</div></div>`).join('');
 t.innerHTML='<table><thead><tr><th>目標日</th><th>週</th><th class="num">預測件數</th><th class="num">實際件數</th><th class="num">建議班</th><th class="num">採用班</th><th class="num">執行率</th><th class="num">實際未開</th><th class="num">併櫃組</th><th class="num">併櫃省km</th><th class="num">每千件里程</th><th class="num">同星期基準</th><th class="num">空駛率</th><th class="num">到著準點率</th><th>到著影響（採用班次的迄站）</th><th>登記</th><th>備註</th><th></th></tr></thead><tbody>'+out.map(o=>`<tr><td><a href="cut.html?d=${o.day}">${o.day}</a></td><td>${o.dow}</td><td class="num">${fmt(o.fc)}</td><td class="num">${fmt(o.act)}</td><td class="num">${o.sug}</td><td class="num">${o.adp}</td><td class="num">${o.rate==null?'—':o.rate+'%'}</td><td class="num">${o.notRun==null?'—':o.notRun}</td><td class="num">${o.mg}</td><td class="num">${fmt(o.mgkm)}</td><td class="num ${o.kpp&&o.bk?(o.kpp<o.bk?'down':'up'):''}">${fmt(o.kpp,1)}</td><td class="num">${fmt(o.bk,1)}</td><td class="num">${fmt(o.er,1)}</td><td class="num">${fmt(o.ot,1)}</td><td style="white-space:normal;max-width:360px">${o.imp?o.imp.map(i=>{const du=i.ub!=null&&i.ubb!=null?i.ub-i.ubb:null;const don=i.on!=null&&i.onb!=null?i.on-i.onb:null;return `<span class="tag" title="拆櫃 ${fmt(i.ub,0)} 分/櫃（基準 ${fmt(i.ubb,0)}）、準點 ${fmt(i.on,0)}%（基準 ${fmt(i.onb,0)}）、遲到 ${fmt(i.late)}">${esc(i.st)} 拆櫃${du==null?'—':(du>0?'+':'')+du.toFixed(0)}分 準點${don==null?'—':(don>0?'+':'')+don.toFixed(0)}點</span>`}).join(' ')||'<span class="muted">無資料</span>':'<span class="muted">—</span>'}</td><td>${esc(o.by)} ${esc(o.at)}</td><td style="white-space:normal">${esc(o.note)}</td><td><a href="#" class="rvdel" data-d="${o.day}">清除</a></td></tr>`).join('')+'</tbody></table>';
 $$('#rvTable a.rvdel').forEach(a=>a.onclick=async ev=>{ev.preventDefault();if(!confirm(a.dataset.d+' 的登記要清除嗎？'))return;try{await api({action:'decide_delete',day:a.dataset.d});rvRun()}catch(e){alert(e.message)}})}catch(e){t.innerHTML='<p class="note">'+esc(e.message)+'</p>'}}
</script></body></html>
