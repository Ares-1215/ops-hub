<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>決策看板｜運務資料中樞</title><meta name="description" content="新竹物流運務處資料中樞：昨天怎麼了、今天要決定什麼">
<link rel="stylesheet" href="assets/app.css"><script src="assets/app.js"></script></head>
<body><main id="m">
<h1 class="pg">決策看板 <span class="small muted" id="asof"></span></h1>
<p class="sub">件數只能預估、不能強求；能動的是班次。這頁只回答兩件事：昨天怎麼了、今天要決定什麼。每個決定都有清單和可省金額，登記後到「成效回看」看有沒有變好。</p>
<div class="grid3" style="align-items:start">
  <div class="card" style="grid-column:span 2"><h3 id="btitle">昨天怎麼了</h3><div class="sub" id="bsub"></div><ul class="brief" id="brief"><li><span class="spin"></span> 載入…</li></ul></div>
  <div class="card"><h3>這些數字可不可信</h3><div id="trust"><span class="spin"></span></div></div>
</div>
<div class="tiles" id="kpi" style="margin:12px 0"></div>
<div class="card"><h3>先行指標：每千件里程（近 8 週）</h3><div class="sub">線＝每日實際值；淡藍帶＝前 4 週同星期的高低區間（落在帶內＝常態；高出帶＝那天比平常貴）。週末底色較深。</div><div id="main"></div><div class="insight" id="mainIns"></div></div>
<h2>今天要決定什麼</h2>
<div class="grid4" id="decide"><div class="card"><span class="spin"></span></div></div>
<p class="note" style="margin-top:14px">每千件里程 ＝ 41 實際里程 ÷ 606 件數 × 1000；推估件成本 ＝ 實際里程 × 單價 ÷ 件數 ＋ 月率（棧板、租櫃、其他），是估算值，單價在「資料與口徑 › 單價校正」調。</p>
</main>
<script>
(async()=>{if(!shell('index.html'))return;try{await loadRows()}catch(e){$('#brief').innerHTML='<li>'+esc(e.message)+'</li>';return}
 const latest=ROWS[ROWS.length-1];const last=ROWS.slice().reverse().find(r=>'一二三四五'.includes(r.dow)&&!r.holiday)||latest;const day=last.day;
 $('#asof').textContent='資料到 '+iso(latest.day)+'（'+latest.dow+'）';$('#btitle').textContent=iso(day)+'（'+last.dow+'）怎麼了';$('#bsub').textContent='最近一個平日；對照基準＝前 4 週同星期平均（排除假日）'+(latest.day!==day?'；週末／假日請看當日快照':'');
 const b=briefing(day);$('#brief').innerHTML=b.slice(0,4).map(s=>`<li>${s}</li>`).join('')+`<li class="muted small">完整 27 個指標與清單 → ${dayLink(day,'當日快照 '+iso(day))}</li>`;
 const base=baseline(day);
 $('#kpi').innerHTML=['km_per_kpiece','cost_pp','empty_rate','low55_n','idle_trips','ontime117'].map(k=>tile(k,last[k],avgOf(base,k),k==='km_per_kpiece',k==='cost_pp'?`估算：運輸 ${fmt(last.est_cost,2)}＋月率 ${fmt(last.nontr,2)}（${last.nontr_src}） <a href="cost.html">拆解</a>`:'')).join('');
 const list=withBaseline(ROWS.slice(-56),'km_per_kpiece');chart('#main',list,[{k:'km_per_kpiece',n:'每千件里程',c:'var(--acc)',band:['km_per_kpiece_bmin','km_per_kpiece_bmax']},{k:'km_per_kpiece_bavg',n:'同星期基準平均',c:'var(--grey)',dash:true,nodots:true}],{zero:false,h:280});$('#mainIns').innerHTML=insight('km_per_kpiece',ROWS.slice(-56));
 /* 今天要決定什麼：四張決策卡 */
 let tmD=new Date(Date.now()+864e5);while(tmD.getDay()===0||tmD.getDay()===6)tmD=new Date(tmD.getTime()+864e5);const tm=lISO(tmD);const w=DOWS[(tmD.getDay()+6)%7];const tmLabel=(tmD.getTime()-Date.now()<2*864e5?'明天 ':'下個平日 ')+tm.slice(5);const price=PRICE();
 let cutN=null,cutKm=0;try{const j=await api({action:'meta',k:'trip_dow'});const td=j.v||{};cutN=0;for(const t of Object.values(td)){const d=t.dow?.[w];if(!d||t.ot_share>0.2)continue;if(d.n4>=3&&d.low55_4>=3){cutN++;cutKm+=t.km||0}}}catch(e){}
 let mgN=null,mgKm=0,otLow=null,otN=null;try{const j=await api({action:'detail',day:iso(day),kinds:['merge_pairs','ot_trips']});const rows=j.rows||[];const mp=(rows.find(r=>r.kind==='merge_pairs')?.payload||[]).filter(x=>x.sum<=100&&(x.delay_min==null||x.delay_min<=120)&&x.from!==x.to1);mgN=mp.length;mgKm=mp.reduce((a,x)=>a+(x.cut_km||0),0);const ot=rows.find(r=>r.kind==='ot_trips')?.payload||[];otN=ot.length;otLow=ot.filter(x=>x.load!=null&&x.load<=55).length}catch(e){}
 let dec=null;try{const j=await api({action:'decide_list',from:tm,to:tm});dec=j.rows[0]||null}catch(e){}
 const card=(title,n,unit,why,href,label,extra='')=>`<div class="card action"><h3>${title}</h3><div class="n">${n==null?'—':fmt(n)}<small>${unit}</small></div><div class="why">${why}</div><div class="go"><a href="${href}">${label}</a>${extra}</div></div>`;
 $('#decide').innerHTML=card(`${tmLabel}（${w}）減開候選`,cutN,'班',`常態低載正班次（≤55% 且近 4 週同星期 ≥3 次）。合計約 ${fmt(cutKm)} km ≈ <b>${fmt(cutKm*price)} 元/日</b>。${dec?`已登記採用 ${(dec.adopted||[]).length} 班。`:'還沒登記。'}`,`cut.html?d=${tm}`,'開清單・登記',`<a class="sec" href="match.html?d=${tm}">該開幾櫃</a>`)
  +card(`${iso(day).slice(5)} 併櫃候選`,mgN,'組',`兩櫃合計積載 ≤100%、延後 ≤120 分，可併一櫃少開一車；同起迄的也是雙拖候選。可省約 ${fmt(mgKm)} km ≈ <b>${fmt(mgKm*price)} 元</b>。`,`merge.html?d=${day}`,'開模擬・登記')
  +card(`${iso(day).slice(5)} 加班卻低載`,otLow,'櫃',`加班封櫃 ${fmt(otN)} 櫃，其中積載 ≤55% 的最該檢討；減開當天同線不應加班。`,`ot.html`,'檢核',`<a class="sec" href="day.html?d=${day}&k=ot_trips">清單</a>`)
  +card(`${iso(day).slice(5)} 空櫃班次`,last.idle_trips,'班',`無效里程 ${fmt(last.idle_km)} km ≈ <b>${fmt((last.idle_km||0)*price)} 元</b>；空駛率 ${fmt(last.empty_rate,1)}%。看哪些站對在對開空櫃。`,`empty.html?d=${day}`,'看回送流向',`<a class="sec" href="day.html?d=${day}&k=idle_trips">清單</a>`);
 /* 資料可不可信 */
 try{const j=await api({action:'status'});const y=lISO(new Date(Date.now()-864e5));const core=(j.coverage||[]).filter(c=>['41','83','2','3','205','206','79','606'].includes(c.rid));const stale=core.filter(c=>!c.max_day||c.max_day<y);const miss=core.reduce((a,c)=>a+(c.missing||[]).length,0);const sync=j.sync?.v;
  $('#trust').innerHTML=`<div class="banner ${stale.length?'warn':'ok'}" style="margin:0 0 8px"><b>${stale.length?'⚠ 有報表還沒到昨天':'✔ 核心日報都到昨天'}</b></div><ul class="brief" style="font-size:13px;margin:0;padding-left:18px;line-height:1.6"><li>最近同步：${sync?esc(sync.at.slice(0,16).replace('T',' ')):'—'}</li><li>核心日報最新：${esc(core.map(c=>c.max_day).filter(Boolean).sort().slice(-1)[0]||'—')}${stale.length?`（落後：${stale.map(c=>c.rid).join('/')}）`:''}</li><li>區間內缺漏：${miss} 天份</li></ul><p class="small" style="margin:6px 0 0"><a href="status.html">→ 更新狀態</a></p>`}catch(e){$('#trust').innerHTML='<p class="note">'+esc(e.message)+'</p>'}
})();
</script></body></html>
