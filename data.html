<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>資料倉｜運務資料中樞</title><link rel="stylesheet" href="assets/app.css"><script src="assets/app.js"></script></head>
<body><main>
<h1 class="pg">資料倉</h1><p class="sub">81 張報表的說明、參數與已抓取的原始檔（線上預覽、下載 CSV／Excel），以及彙整後的衍生資料。</p>
<div class="split">
  <div>
    <div class="bar"><input id="rq" type="search" placeholder="搜尋報表" style="flex:1"></div>
    <div class="list" id="rlist"><span class="spin"></span></div>
    <div class="list" style="margin-top:10px;max-height:none"><div class="grp">衍生資料（彙整）</div>
      <a class="it" href="data.html?meta=trip_km"><span class="rid">KM</span>班次里程字典（113 回填）</a>
      <a class="it" href="data.html?meta=trip_load"><span class="rid">LOAD</span>班次積載率彙整（205）</a>
      <a class="it" href="data.html?meta=idle_trips"><span class="rid">IDLE</span>空櫃班次彙整（206×31）</a>
      <a class="it" href="data.html?meta=pair_low"><span class="rid">PAIR</span>併櫃候選站對（同日多櫃低載）</a>
      <a class="it" href="data.html?meta=ot_agg"><span class="rid">OT</span>加班班次彙整</a>
    </div>
  </div>
  <div id="rpanel"><p class="muted">左側選一張報表，或網址帶 ?rid=41。</p></div>
</div>
</main>
<script>
let CATALOG=[],CUR=null;
(async()=>{if(!shell('data.html'))return;try{const j=await api({action:'meta',k:'catalog'});CATALOG=(j.v||[]).sort((a,b)=>(b.star||0)-(a.star||0)||(+a.rid)-(+b.rid))}catch(e){$('#rlist').innerHTML='<p class="note">'+esc(e.message)+'</p>';return}
 $('#rq').oninput=renderList;renderList();const rid=qs('rid'),meta=qs('meta');if(rid)openReport(rid);else if(meta)openMeta(meta)})();
function renderList(){const q=$('#rq').value.trim().toLowerCase();const order=['運務','車輛管理','新竹物流管理報表','貨櫃追蹤','自動化管理報表','99-測試區','跨境','貨物查詢','站所','數位發展中心','新瑞運輸管理報表','新瑞宅配管理報表'];let h='';for(const c of order){const its=CATALOG.filter(r=>r.cls===c&&(!q||(r.rid+' '+r.name+' '+r.use).toLowerCase().includes(q)));if(!its.length)continue;h+=`<div class="grp">${esc(c)} <span class="muted">${its.length}</span></div>`+its.map(r=>`<a class="it ${CUR?.rid===r.rid?'on':''}" href="data.html?rid=${r.rid}"><span class="rid">${r.rid}</span><span>${esc(r.name.replace(/^【[^】]*】/,''))}</span><span class="st">${r.risk?'⚠':'★'.repeat(r.star||0)}</span></a>`).join('')}$('#rlist').innerHTML=h||'<p class="note">無符合</p>'}
async function openReport(rid){CUR=CATALOG.find(r=>r.rid===rid);if(!CUR){$('#rpanel').innerHTML='<p class="note">查無此報表</p>';return}renderList();const r=CUR;document.title=`${r.rid} ${r.name}｜資料倉`;const pn=$('#rpanel');
 pn.innerHTML=`<div class="card"><h3><span class="rid">${r.rid}</span> ${esc(r.name)} <span class="star">${'★'.repeat(r.star||0)}</span></h3>
 <dl class="kv"><dt>類別</dt><dd>${esc(r.cls)}</dd><dt>粒度</dt><dd>${esc(r.grain||'—')}</dd><dt>用途</dt><dd>${esc(r.use||'—')}</dd>${r.keys?`<dt>關鍵欄位</dt><dd>${esc(r.keys)}</dd>`:''}${r.caveat?`<dt>踩雷</dt><dd style="color:var(--warn)">${esc(r.caveat)}</dd>`:''}${r.risk?`<dt>限制</dt><dd style="color:var(--warn)">⚠ 不送查詢：${esc(r.risk)}</dd>`:''}</dl>
 <details><summary>參數（RPT_COND=<code>${esc(r.rpt_cond)}</code>）</summary><table><thead><tr><th>欄</th><th>標籤</th><th>型別</th><th>預設</th></tr></thead><tbody>${(r.params||[]).map(p=>`<tr><td><code>${p.name}</code></td><td>${esc(p.label)}</td><td>${p.type}</td><td><code>${esc(p.default)}</code></td></tr>`).join('')}</tbody></table></details>
 ${r.header?.length?`<details><summary>輸出欄位（${r.header.length}）</summary><div class="chips">${r.header.map(h=>`<span>${esc(h)}</span>`).join('')}</div></details>`:''}</div>
 <h2 style="margin-top:12px">已抓取檔案 <span class="small muted" id="fcount"><span class="spin"></span></span></h2><div class="bar"><input id="fq" type="search" placeholder="篩日期，如 202609"><span class="note">點檔名預覽（前 3,000 列）；⬇ 下載整檔 CSV / Excel</span></div><div class="scroll" id="flist" style="max-height:260px"></div><div id="fview"></div>`;
 try{const j=await api({action:'raw_list',rid});const items=j.items.filter(i=>i.name.endsWith('.csv.gz'));$('#fcount').textContent=`${items.length} 檔`;const render=()=>{const q=$('#fq').value.trim();const its=items.filter(i=>!q||i.name.includes(q)).slice().reverse();$('#flist').innerHTML=its.length?'<table><thead><tr><th>檔案</th><th class="num">大小(gz)</th><th>更新</th><th></th></tr></thead><tbody>'+its.map(i=>`<tr><td><a href="#" data-f="${esc(i.name)}" class="pv">${esc(i.name.replace('.csv.gz',''))}</a></td><td class="num">${fmt(i.size/1024,0)} KB</td><td>${esc((i.updated||'').slice(0,16).replace('T',' '))}</td><td><a href="#" data-f="${esc(i.name)}" class="dl">⬇ CSV</a> <a href="#" data-f="${esc(i.name)}" class="dx">⬇ Excel</a></td></tr>`).join('')+'</tbody></table>':'<p class="note">無檔案</p>';$$('#flist a').forEach(a=>a.onclick=ev=>{ev.preventDefault();const f=a.dataset.f;if(a.classList.contains('pv'))preview(rid,f);else if(a.classList.contains('dl'))downloadRaw(rid,f,'csv');else downloadRaw(rid,f,'xlsx')})};render();$('#fq').oninput=render}catch(e){$('#fcount').textContent=e.message}}
async function fetchRaw(rid,f){const j=await api({action:'raw_url',path:`${rid}/${f}`});const r=await fetch(j.url);if(!r.ok)throw new Error('下載失敗 '+r.status);const ds=new DecompressionStream('gzip');return await new Response(r.body.pipeThrough(ds)).text()}
function namesFor(rid,ncol){const r=CATALOG.find(x=>x.rid===rid);const base=(r?.csv_names&&r.csv_names.length?r.csv_names:(r?.header||[]));const out=[];for(let i=0;i<ncol;i++){const n=base[i]||`欄${i+1}`;out.push(n.replace(/^_hidden(\d+)$/,'(隱藏$1)'))}return out}
async function preview(rid,f){const v=$('#fview');v.innerHTML='<p class="note"><span class="spin"></span> 下載解壓…</p>';try{const txt=await fetchRaw(rid,f);const rows=parseCsv(txt);const ncol=Math.max(...rows.map(r=>r.length));const names=namesFor(rid,ncol);let q='';const render=()=>{const rs=rows.filter(r=>!q||r.join(' ').toLowerCase().includes(q)).slice(0,3000);$('#pvt').innerHTML='<table><thead><tr><th>#</th>'+names.map(n=>`<th>${esc(n)}</th>`).join('')+'</tr></thead><tbody>'+rs.map((r,i)=>`<tr><td class="muted">${i+1}</td>`+names.map((_,j)=>`<td>${esc(r[j]??'')}</td>`).join('')+'</tr>').join('')+'</tbody></table>';$('#pvc').textContent=`${rs.length} / ${rows.length} 列`};
 v.innerHTML=`<h2 style="margin-top:12px">${esc(f.replace('.csv.gz',''))} <span class="small muted" id="pvc"></span></h2><div class="bar"><input id="pvq" type="search" placeholder="篩選列"><span class="note">欄名由樣本自動對應；標「(隱藏N)」者為 CSV 隱藏欄</span></div><div class="scroll" id="pvt"></div>`;render();$('#pvq').oninput=e=>{q=e.target.value.trim().toLowerCase();render()}}catch(e){v.innerHTML='<p class="note">'+esc(e.message)+'</p>'}}
async function downloadRaw(rid,f,type){try{const txt=await fetchRaw(rid,f);const rows=parseCsv(txt);const ncol=Math.max(...rows.map(r=>r.length));const names=namesFor(rid,ncol);const base=`${rid}_${f.replace('.csv.gz','')}`;if(type==='csv'){dlText('﻿'+[names.join(','),...rows.map(r=>r.map(c=>/[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c).join(','))].join('\n'),base+'.csv','text/csv')}else{await exportXlsx(names.map((n,i)=>[i,n]),rows.map(r=>Object.fromEntries(r.map((c,i)=>[i,c]))),base)}}catch(e){alert(e.message)}}
async function openMeta(k){CUR=null;renderList();const titles={trip_km:'班次里程字典（113 回填）',trip_load:'班次積載率彙整（205）',idle_trips:'空櫃班次彙整（206×31）',pair_low:'併櫃候選站對',ot_agg:'加班班次彙整'};const pn=$('#rpanel');pn.innerHTML=`<h2>${esc(titles[k]||k)} <span class="small muted" id="mc"><span class="spin"></span></span></h2><div class="bar"><input id="mq" type="search" placeholder="篩選"><button id="mx">⬇ Excel</button></div><div class="scroll" id="mt"></div>`;
 try{const j=await api({action:'meta',k});const v=j.v||{};let cols,rows;if(k==='trip_km'){cols=[['code','班次'],['name','名稱'],['from','起站'],['to','迄站'],['dep','預定離'],['arr','預定進'],['km_med','里程(中位)'],['km_min','最小'],['km_max','最大'],['n','樣本']];rows=Object.entries(v).map(([c,t])=>({code:c,...t}))}
 else if(k==='trip_load'){cols=[['code','班次'],['name','名稱'],['from','起站'],['to','迄站'],['days','出現天數'],['n','櫃數'],['ot','加班櫃'],['low55','低載櫃'],['low55_share','低載比'],['avg_load','平均積載率'],['med_load','中位積載率']];rows=Object.entries(v).map(([c,t])=>({code:c,...t,low55_share:Math.round(t.low55_share*100)+'%'})).sort((a,b)=>b.low55-a.low55)}
 else if(k==='idle_trips'){cols=[['code','班次'],['name','名稱'],['from','起站'],['to','迄站'],['km','里程'],['n','出現天數'],['tot','累計無效里程']];rows=Object.entries(v).map(([c,t])=>({code:c,...t,tot:t.km!=null?Math.round(t.km*t.n):''})).sort((a,b)=>(b.tot||0)-(a.tot||0))}
 else if(k==='ot_agg'){cols=[['code','班次'],['name','名稱'],['from','起站'],['to','迄站'],['dir','方向'],['ot_days','加班天數'],['boxes','櫃數'],['low55','加班卻低載'],['avg','平均積載'],['last','最近']];rows=Object.entries(v).map(([c,t])=>({code:c,...t,last:iso(t.last)})).sort((a,b)=>b.low55-a.low55)}
 else{cols=[['pair','起站→迄站'],['pairs_2plus','同日≥2櫃低載天數'],['days','有低載天數'],['low_total','低載櫃合計']];rows=Object.entries(v).map(([p,t])=>({pair:p,...t})).sort((a,b)=>b.pairs_2plus-a.pairs_2plus)}
 const render=()=>{const q=$('#mq').value.trim().toLowerCase();const rs=rows.filter(r=>!q||Object.values(r).join(' ').toLowerCase().includes(q));$('#mc').textContent=`${rs.length} 筆（更新 ${(j.updated_at||'').slice(0,16).replace('T',' ')}）`;$('#mt').innerHTML='<table><thead><tr>'+cols.map(c=>`<th>${c[1]}</th>`).join('')+'</tr></thead><tbody>'+rs.slice(0,3000).map(r=>'<tr>'+cols.map(c=>`<td>${c[0]==='code'?tripLink(r.code):esc(r[c[0]]??'')}</td>`).join('')+'</tr>').join('')+'</tbody></table>'};render();$('#mq').oninput=render;$('#mx').onclick=()=>exportXlsx(cols,rows,k)}catch(e){$('#mt').innerHTML='<p class="note">'+esc(e.message)+'</p>'}}
</script></body></html>
